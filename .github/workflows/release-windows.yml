name: Release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: eskusmi ${{ github.ref_name }}
          releaseBody: |
            Windows installer for eskusmi.

            Download `eskusmi-setup.exe`, install, and eskusmi will start with Windows by default.

            **Interrupt, without interrupting.**
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Rename installer artifact
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          if (-not $bundle) {
            throw "NSIS installer not found under src-tauri/target/release/bundle/nsis"
          }
          $out = Join-Path $bundle.DirectoryName "eskusmi-setup.exe"
          Copy-Item -Force $bundle.FullName $out
          Write-Output "ARTIFACT=$out"
          Write-Output "SOURCE=$($bundle.Name)"

      - name: Upload eskusmi-setup.exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/eskusmi-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
