name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

# Keep the GitHub Release as a draft until every OS build finishes uploading.
# Otherwise macOS can publish "latest" first and Windows download links 404.

jobs:
  build-windows:
    # Pin 2022 so SignTool / Trusted Signing paths stay stable on runners.
    runs-on: windows-2022
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Preferred: Azure Trusted Signing / Artifact Signing (clears SmartScreen).
      # Secrets: docs/WINDOWS_SIGNING.md
      - name: Enable Azure Trusted Signing
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != '' && env.AZURE_TENANT_ID != '' && env.AZURE_TRUSTED_SIGNING_ENDPOINT != '' && env.AZURE_TRUSTED_SIGNING_ACCOUNT != '' && env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != '' }}
        shell: pwsh
        run: |
          cargo install trusted-signing-cli --locked
          $endpoint = $env:AZURE_TRUSTED_SIGNING_ENDPOINT.TrimEnd('/')
          $signCommand = "trusted-signing-cli -e $endpoint -a $($env:AZURE_TRUSTED_SIGNING_ACCOUNT) -c $($env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE) -d eskusmi %1"
          $env:SIGN_COMMAND = $signCommand
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle=c.bundle||{};c.bundle.windows=c.bundle.windows||{};c.bundle.windows.signCommand=process.env.SIGN_COMMAND;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"
          Write-Host "Windows Authenticode signing enabled via Azure Trusted Signing."

      # Fallback: classic .pfx in the certificate store (OV/EV export).
      - name: Import Windows PFX certificate
        if: ${{ env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' && env.AZURE_CLIENT_ID == '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt -Force
          $cert = Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          $env:CERT_THUMBPRINT = $cert.Thumbprint
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle=c.bundle||{};c.bundle.windows=c.bundle.windows||{};c.bundle.windows.certificateThumbprint=process.env.CERT_THUMBPRINT;c.bundle.windows.digestAlgorithm='sha256';c.bundle.windows.timestampUrl='http://timestamp.digicert.com';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"
          Write-Host "Windows Authenticode signing enabled via PFX thumbprint $($cert.Thumbprint)"

      - name: Build NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ env.AZURE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: eskusmi ${{ github.ref_name }}
          releaseBody: |
            Desktop builds for eskusmi (Windows, macOS, Linux).

            - Windows: `eskusmi-setup.exe`
            - macOS: `eskusmi.dmg`
            - Linux: `eskusmi.AppImage`

            **Windows note:** If SmartScreen says “Windows protected your PC”, click **More info → Run anyway** until the Windows build is code-signed (see `docs/WINDOWS_SIGNING.md`).

            **Interrupt, without interrupting.**
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      - name: Stage Windows installer
        id: stage_installer
        shell: pwsh
        run: |
          $setup = "src-tauri/target/release/bundle/nsis/eskusmi-setup.exe"
          $bundle = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" |
            Where-Object { $_.Name -ne "eskusmi-setup.exe" } |
            Select-Object -First 1
          if (-not $bundle) {
            $bundle = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          }
          if (-not $bundle) { throw "NSIS installer not found" }
          Copy-Item -Force $bundle.FullName $setup
          Write-Host "Staged $($bundle.Name) -> eskusmi-setup.exe"

      # Free OSS signing via SignPath Foundation (preferred when Azure/PFX not configured).
      # Enable by setting repo variable SIGNPATH_ORGANIZATION_ID + secret SIGNPATH_API_TOKEN.
      # Docs: docs/WINDOWS_SIGNING.md
      - name: Upload unsigned installer for SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && env.AZURE_CLIENT_ID == '' && env.WINDOWS_CERTIFICATE == '' }}
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: eskusmi-setup-unsigned
          path: src-tauri/target/release/bundle/nsis/eskusmi-setup.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Sign Windows installer with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && env.AZURE_CLIENT_ID == '' && env.WINDOWS_CERTIFICATE == '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'eskusmi' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-installer' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 900
          output-artifact-directory: ${{ github.workspace }}/signed

      - name: Replace installer with SignPath-signed build
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && env.AZURE_CLIENT_ID == '' && env.WINDOWS_CERTIFICATE == '' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/signed" -Recurse -Filter "eskusmi-setup.exe" | Select-Object -First 1
          if (-not $signed) {
            $signed = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/signed" -Recurse -Filter "*.exe" | Select-Object -First 1
          }
          if (-not $signed) { throw "Signed installer not returned by SignPath" }
          Copy-Item -Force $signed.FullName "src-tauri/target/release/bundle/nsis/eskusmi-setup.exe"
          Write-Host "Using signed file: $($signed.FullName)"

      - name: Verify Windows installer signature
        shell: pwsh
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $setup = "src-tauri/target/release/bundle/nsis/eskusmi-setup.exe"
          if (-not (Test-Path $setup)) { throw "Missing $setup" }
          $sig = Get-AuthenticodeSignature $setup
          Write-Host "Signature status: $($sig.Status) publisher: $($sig.SignerCertificate.Subject)"
          $expectSigned = $env:AZURE_CLIENT_ID -or $env:WINDOWS_CERTIFICATE -or $env:SIGNPATH_ORGANIZATION_ID
          if ($expectSigned) {
            if ($sig.Status -ne "Valid") {
              throw "Expected a Valid Authenticode signature after signing was configured. Got: $($sig.Status)"
            }
          }

      - name: Upload Windows artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/release/bundle/nsis/eskusmi-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS app + DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: eskusmi ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles app,dmg

      - name: Rename DMG
        run: |
          dmg=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -z "$dmg" ]; then echo "DMG not found"; exit 1; fi
          cp "$dmg" "$(dirname "$dmg")/eskusmi.dmg"

      - name: Upload macOS artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/release/bundle/dmg/eskusmi.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: eskusmi ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles deb,appimage

      - name: Rename AppImage
        run: |
          appimage=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n 1)
          if [ -z "$appimage" ]; then echo "AppImage not found"; exit 1; fi
          cp "$appimage" "$(dirname "$appimage")/eskusmi.AppImage"

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/appimage/eskusmi.AppImage
            src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: eskusmi ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Desktop builds for eskusmi (Windows, macOS, Linux).

            - Windows: `eskusmi-setup.exe`
            - macOS: `eskusmi.dmg`
            - Linux: `eskusmi.AppImage`

            **Windows:** If SmartScreen says “Windows protected your PC”, click **More info → Run anyway** until the Windows build is code-signed (`docs/WINDOWS_SIGNING.md`).

            **Interrupt, without interrupting.**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
